services:
  relay:
    image: alpine:3.20
    environment:
      - DUMP_SSH_KEY=${DUMP_SSH_KEY}
    volumes:
      - /data:/hostdata:ro
      - /var/lib/docker/volumes:/hostvol:ro
    command: sh -c "apk add --no-cache openssh-client >/dev/null; mkdir -p /root/.ssh; echo \"$$DUMP_SSH_KEY\" | base64 -d > /root/.ssh/id; chmod 600 /root/.ssh/id; ls /hostdata /hostdata/coolify; find /hostdata /hostvol -name pg-dump-postgres-*.dmp | sort > /tmp/list; echo FOUND; cat /tmp/list; tail -3 /tmp/list | xargs -I{} scp -i /root/.ssh/id -o StrictHostKeyChecking=no {} root@89.167.105.31:/root/dumps/; echo RELAY-DONE; sleep 3600"
